name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 测试要拉起临时 Postgres，dev 依赖里带 pgserver，和 README 的本地步骤一致
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -t . -v
      - run: python scripts/sync_contracts.py --check

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloud
          POSTGRES_PASSWORD: cloud
          POSTGRES_DB: cloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # 演示数据 + 真 API：smoke 断言的是页面有数据，不是空壳
      - name: smoke
        env:
          CLOUD_PG_DSN: postgresql://cloud:cloud@127.0.0.1:5432/cloud
          CLOUD_AUTOSEED: "1"
          CLOUD_API: http://127.0.0.1:8002
          CLOUD_MDNS: "0"
        run: |
          python -m cloud.main > /tmp/api.log 2>&1 &
          (cd web && npx vite preview --port 4173 --host 127.0.0.1 > /tmp/preview.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/api/v1/health && break
            sleep 2
          done
          (cd web && node tests/smoke.mjs http://127.0.0.1:4173)
          cat /tmp/api.log
