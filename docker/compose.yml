name: modular-terminal-cloud

# 云节点：caddy + web + api + worker + postgres + redis + ollama（文档 §6.1）
# 数据卷：pgdata、caddy_data、backups、ollama_models
x-cloud: &cloud
  image: modular-terminal-cloud:2.0.0
  restart: unless-stopped
  # 宿主 data/backups 目录归当前用户，容器跟着用同一个 uid/gid 才写得进去
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  # 读 cloud-ca 指纹用（mDNS TXT），只读挂载
  volumes:
    - ./certs:/certs:ro
    # 模型 SHA256 清单与运行数据（文档 §6.8）
    - ${CLOUD_DATA_HOST_DIR:-../data}:/app/data
  environment: &cloud-env
    CLOUD_ID: ${CLOUD_ID:-cloud-home-01}
    CLOUD_NAME: ${CLOUD_NAME:-私有云 · 家庭实验室}
    CLOUD_DOMAIN: ${CLOUD_DOMAIN:-localhost}
    CLOUD_PG_DSN: postgresql://cloud:${CLOUD_DB_PASSWORD:?必须设置 CLOUD_DB_PASSWORD}@postgres:5432/cloud
    CLOUD_REDIS_URL: redis://:${CLOUD_REDIS_PASSWORD:?必须设置 CLOUD_REDIS_PASSWORD}@redis:6379/0
    CLOUD_BACKUP_DIR: /backups
    CLOUD_EDGE_TOKEN: ${CLOUD_EDGE_TOKEN:-}
    CLOUD_ADMIN_TOKEN: ${CLOUD_ADMIN_TOKEN:-}
    # 管理员登录：口令 + TOTP。留空等于没配，管理接口一律 403
    CLOUD_ADMIN_PASSWORD: ${CLOUD_ADMIN_PASSWORD:-}
    CLOUD_ADMIN_TOTP: ${CLOUD_ADMIN_TOTP:-}
    # 没配口令/令牌时管理接口默认 403；本机演示要显式打开
    CLOUD_DEMO_OPEN: ${CLOUD_DEMO_OPEN:-0}
    CLOUD_AI_MODE: ${CLOUD_AI_MODE:-local}
    CLOUD_DEMO: ${CLOUD_DEMO:-1}
    # mDNS 交给宿主 Avahi（scripts/install_avahi.sh）；容器里广播的是容器 IP
    CLOUD_MDNS: ${CLOUD_MDNS:-0}
    CLOUD_BUILD: ${CLOUD_BUILD:-compose-dev}
    # 空库首次启动写 14 天演示数据；生产必须保持 0，否则真实库会混进假数据
    CLOUD_AUTOSEED: ${CLOUD_AUTOSEED:-0}
    # 每周加密副本用的对称密钥；没有它就加密不了，worker 会写审计
    CLOUD_BACKUP_KEY_FILE: /run/secrets/backup.key
    CLOUD_OLLAMA_URL: ${CLOUD_OLLAMA_URL:-http://ollama:11434}
    CLOUD_OLLAMA_MODEL: ${CLOUD_OLLAMA_MODEL:-qwen3.5:9b}
    CLOUD_OLLAMA_SHA256: ${CLOUD_OLLAMA_SHA256:-}
    TZ: Asia/Shanghai

services:
  # 内网 TLS 入口（cloud-ca 签发）。公网只放行两条 API，见 Caddyfile
  caddy:
    image: caddy:2-alpine
    container_name: mt-cloud-caddy
    restart: unless-stopped
    ports:
      # 管理台只在内网：绑到 LAN 网卡，避免 0.0.0.0 被端口转发出去
      - "${CLOUD_LAN_IP:-0.0.0.0}:443:443"
      - "80:80"
      - "8443:8443"   # 边 → 云的 mTLS 入口
      - "127.0.0.1:8088:8088"   # 本机明文入口，调试与截图用
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  # 静态前端（构建产物由镜像里的 web 服务提供）
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: modular-terminal-cloud-web:2.0.0
    container_name: mt-cloud-web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  # 只接请求：查询、管理、摄取
  api:
    <<: *cloud
    # 只在 api 上构建一次，worker 复用同一镜像（两个服务同时构建会撞标签）
    build:
      context: ..
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: mt-cloud-api
    # api 端口没有发布到宿主，只有 Caddy 连得到，所以 X-Forwarded-* 可信：
    # uvicorn 需要它才知道真实来源 IP 与协议（会话 cookie 的 Secure 也靠它）
    command: ["python", "-m", "uvicorn", "cloud.main:app", "--host", "0.0.0.0",
              "--port", "8002", "--forwarded-allow-ips=*"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1g

  # 队列消费者 + 定时任务（AI 报告、词频、跨边聚合、清理、备份）
  worker:
    <<: *cloud
    container_name: mt-cloud-worker
    command: ["python", "-m", "cloud.worker"]
    environment:
      <<: *cloud-env
      CLOUD_QUEUE_SYNC: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # 镜像里的 HEALTHCHECK 是给 api 的，worker 不监听端口
    healthcheck:
      disable: true
    volumes:
      - ${CLOUD_BACKUP_HOST_DIR:-../backups}:/backups
      - ${CLOUD_DATA_HOST_DIR:-../data}:/app/data
      - ${CLOUD_BACKUP_KEY_HOST:-../.secrets/backup.key}:/run/secrets/backup.key:ro
    deploy:
      resources:
        limits:
          memory: 1g

  postgres:
    image: postgres:16-alpine
    container_name: mt-cloud-db
    restart: unless-stopped
    ports:
      # 只给宿主机上的原生模式用（run.sh 默认连 127.0.0.1:5432），不对外
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: cloud
      POSTGRES_USER: cloud
      # 必填：没设置就拒绝启动，别用 cloud/cloud 默认口令
      POSTGRES_PASSWORD: ${CLOUD_DB_PASSWORD:?必须设置 CLOUD_DB_PASSWORD}
    volumes:
      # 默认命名卷；跑过 scripts/setup_encrypted_volume.sh 后把 CLOUD_PGDATA 指到 LUKS 挂载点
      - ${CLOUD_PGDATA:-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud -d cloud"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g

  redis:
    image: redis:7-alpine
    container_name: mt-cloud-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    # 口令必填：以前 redis 完全无口令，同网段的任何容器都能直接读写队列与缓存
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "256mb",
              "--maxmemory-policy", "allkeys-lru", "--requirepass", "${CLOUD_REDIS_PASSWORD:?必须设置 CLOUD_REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          memory: 1g

  # 本地模型（模式 B）。没 GPU 会很慢，CLOUD_AI_MODE=rules 可跳过
  ollama:
    # 可选：默认不启动。要本地模型时
    # docker compose --profile ai up -d ollama && docker compose exec ollama ollama pull qwen3.5:9b
    profiles: ["ai"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: mt-ollama
    restart: unless-stopped
    environment:
      # 文档 §6.3：并发 1，避免几份报告同时挤显存
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 8g

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  ollama_models:

networks:
  default:
    name: mt-backbone
